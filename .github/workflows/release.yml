name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version du tag ($TAG_VERSION) != version package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Build renderer
        run: npm run build

      - name: Generate application icon
        run: npm run icon

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: List release artifacts
        shell: bash
        run: ls -la release

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.exe release/latest.yml release/*.blockmap \
            --title "Fanalamanga SA Approvisionnement ${GITHUB_REF_NAME#v}" \
            --notes "Version ${GITHUB_REF_NAME#v}"
